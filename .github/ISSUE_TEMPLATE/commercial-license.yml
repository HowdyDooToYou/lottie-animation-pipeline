name: Commercial license
description: Request commercial, studio, product, OEM, or hosted-service rights.
title: "[Commercial license] "
labels:
  - commercial-license
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest. Do not post confidential information here. We will move legal and commercial details to a private channel.
  - type: dropdown
    id: plan
    attributes:
      label: Intended plan
      options:
        - Creator
        - Studio
        - Product / OEM
        - Custom / enterprise
    validations:
      required: true
  - type: dropdown
    id: use
    attributes:
      label: Primary use
      options:
        - Internal production
        - Client animation delivery
        - Product embedding
        - Hosted generation service
        - Redistribution
        - Other
    validations:
      required: true
  - type: input
    id: organization
    attributes:
      label: Organization or project
      description: Public name only; do not include legal or confidential details.
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Public use-case summary
      description: A short, non-confidential description of the intended use.
    validations:
      required: true
